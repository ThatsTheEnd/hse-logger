version: "3.8"

networks:
  loki:
    driver: bridge

volumes:
  loki-data: {}   # <-- Persistent storage volume for Loki
  influxdb2-data:
  influxdb2-config:

services:
  # clickhouse:  
  #     image: clickhouse/clickhouse-server:latest  
  #     container_name: clickhouse  
  #     environment:
  #       - CLICKHOUSE_USER=admin
  #       - CLICKHOUSE_PASSWORD=admin
  #       - TZ=Europe/Zurich  # Optional — helps the OS layer
  #     ulimits:
  #       nofile:
  #         soft: 262144
  #         hard: 262144
  #     ports:    
  #       - "8123:8123" # HTTP port    
  #       - "9000:9000" # Native TCP port
  #     restart: unless-stopped
  #     networks:
  #       - loki
  loki:
    image: grafana/loki:3.6.1   # or a specific 3.x, avoid "latest"
    ports:
      - "3100:3100"
    command: 
      - -config.file=/etc/loki/local-config.yaml
      - -print-config-stderr 
    volumes:
      - loki-data:/loki
      # - ./loki-config.yaml:/etc/loki/local-config.yaml:ro   # <--- NEW: your config
    networks:
      - loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/log:/var/log           # Read system logs
    command: -config.file=/etc/promtail/config.yml
    networks:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_FEATURE_TOGGLES_ENABLE=alertingSimplifiedRouting,alertingQueryAndExpressionsStepMode
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          type: loki
          access: proxy 
          orgId: 1
          url: http://loki:3100
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        EOF
        /run.sh
    ports:
      - "3000:3000"
    networks:
      - loki
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_PROMETHEUS_RETENTION_POLICY=10m
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    networks:
      - loki
    restart: unless-stopped
    command: >
      sh -c "
      rabbitmq-plugins enable --offline rabbitmq_prometheus &&
      rabbitmq-server"

